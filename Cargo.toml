[package]
name = "lamina-units"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Typed physical quantities, units and spectral coordinate maps for planar optics"
license = "MIT OR Apache-2.0"
authors = ["Christopher R. Gubbin <cgubbin@gmail.com>"]
repository = "https://github.com/cgubbin/lamina-units"
readme = "README.md"
keywords = ["optics", "photonics", "units", "wavenumber", "spectroscopy"]
categories = ["science", "mathematics"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE*"]

[lib]
name = "lamina_units"
path = "src/lib.rs"


[dependencies]
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = "2.0.19"

[dev-dependencies]
approx = "0.5.1"


[profile.dev]
debug = true

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.metadata.release]
tag = true
push = true
publish = true
sign-commit = false

[features]
serde = ["dep:serde"]
